[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-salsa"
version = "0.1.0.dev0"
description = "Lightweight, CPU-first re-implementation of the SALSA attack on LWE lattice cryptography"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["lattice", "LWE", "cryptanalysis", "transformer", "model-compression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23,<3",
    "PyYAML>=6.0",
    "torch>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["salsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
